- generic [ref=e2]: "{\"object\":\"list\",\"data\":[{\"slug\":\"2026-04-21-ops-admin-tab\",\"body\":\"The Operations tab in the admin panel now shows a live view of the background scheduler, active outbound campaigns with inline pause/resume, 30-day email deliverability (delivered / opened / clicked / bounced / complained), and product readiness (what's live vs. what's waiting on credentials).\\n\\nA public `/api/status` endpoint returns component-level health (database, automation engine, AI inference, email delivery) so you can link customers to proof that things are running.\",\"published\":true,\"published_at\":\"2026-04-21T20:00:00Z\",\"summary\":\"One glance at scheduler health, queue depth, deliverability, and readiness — plus a public /api/status trust signal.\",\"tag\":\"feature\",\"title\":\"New Operations admin tab + public status page\",\"updated_at\":\"2026-04-20T23:05:18.955142+00:00\"},{\"slug\":\"2026-04-21-customer-dashboard\",\"body\":\"Users now see their own activity in one endpoint: credits remaining, campaigns active, emails sent/opened/clicked, images + videos generated. A savings estimator compares what they paid MAARS vs industry per-unit pricing (conservative — we understate rather than inflate) so retention shows its receipts.\",\"published\":true,\"published_at\":\"2026-04-21T19:30:00Z\",\"summary\":\"/me/usage shows credits, campaigns, emails, media, and a conservative 'what this would cost DIY' delta.\",\"tag\":\"feature\",\"title\":\"Customer usage dashboard with savings estimate\",\"updated_at\":\"2026-04-20T23:05:19.013649+00:00\"},{\"slug\":\"2026-04-21-annual-billing\",\"body\":\"Subscribing annually saves 20% on price and adds 2 extra months of credits beyond the 12× monthly total — so an annual commit is ~+37% more value at ~-20% spend. Stripe interval set to `year` when the annual path is chosen. Monthly remains the default.\",\"published\":true,\"published_at\":\"2026-04-21T19:00:00Z\",\"summary\":\"Every plan now has an annual option; /api/plans returns both monthly and annual with savings math baked in.\",\"tag\":\"feature\",\"title\":\"Annual plans with 20% discount + 2 bonus credit-months\",\"updated_at\":\"2026-04-20T23:05:19.014653+00:00\"},{\"slug\":\"2026-04-21-gdpr-compliance\",\"body\":\"Users can download a complete JSON export of every record tied to their account and request deletion (30-day soft grace, with confirm-immediate option). New pages: `/privacy`, `/terms`. A GDPR-aware cookie consent banner appears for EU/UK visitors (detected via timezone) and persists choice. Transactional email flows (welcome, low-credit, payment success/failure, trial-ending, referral-reward, weekly digest) all live.\",\"published\":true,\"published_at\":\"2026-04-21T18:00:00Z\",\"summary\":\"Art. 15 (access) and Art. 17 (erasure) are live. Privacy Policy, Terms of Service, and cookie consent banner all shipped.\",\"tag\":\"compliance\",\"title\":\"GDPR data export + deletion endpoints\",\"updated_at\":\"2026-04-20T23:05:19.014653+00:00\"},{\"slug\":\"2026-04-21-prompt-library\",\"body\":\"Prompts persist across sessions with use-count ranking so the most-effective ones bubble up. CSV import auto-detects common export headers (email, first/last name, title, company, LinkedIn, phone) and normalizes them into the same shape the campaign orchestrator consumes — so an imported list plugs directly into `run_campaign`.\",\"published\":true,\"published_at\":\"2026-04-21T17:30:00Z\",\"summary\":\"Save, tag, and share prompts across a workspace. Upload any CSV of leads — we normalize Apollo / Hunter / Sales Nav / Seamless / Lusha headers.\",\"tag\":\"feature\",\"title\":\"Prompt library + CSV lead import\",\"updated_at\":\"2026-04-20T23:05:19.015684+00:00\"},{\"slug\":\"2026-04-21-workflow-builder\",\"body\":\"Workflows are stored as typed-node graphs. Each node is an action (`search_leads`, `draft_email`, `send_email`, `wait`, etc.) with next-pointers that form a DAG. CRUD + run endpoints are live; execution engine walks the DAG through the same services agents already use. Full drag-drop UI lands next release.\",\"published\":true,\"published_at\":\"2026-04-21T17:00:00Z\",\"summary\":\"Define multi-step automations (find leads → enrich → draft → wait → follow-up) as DAGs that the scheduler executes.\",\"tag\":\"feature\",\"title\":\"Workflow builder data model + execution queue\",\"updated_at\":\"2026-04-20T23:05:19.016672+00:00\"},{\"slug\":\"2026-04-21-more-free-providers\",\"body\":\"The router now defaults to the highest-quality free tier for each modality before paying anyone: Microsoft Edge neural voices (400+ premium options, $0), Pollinations Flux for images (unlimited, $0), Deepgram Nova-2 for transcription (45K minutes/mo free), Brave Search for web results (2K queries/mo free). Paid providers remain in the chain as quality-verified fallbacks.\",\"published\":true,\"published_at\":\"2026-04-21T16:30:00Z\",\"summary\":\"Premium quality on zero budget. 400+ neural voices, unlimited Flux images, 45K transcription minutes/mo, 2K search queries/mo.\",\"tag\":\"improvement\",\"title\":\"More free-first routing: Edge voice, Pollinations images, Deepgram STT, Brave search\",\"updated_at\":\"2026-04-20T23:05:19.016672+00:00\"},{\"slug\":\"2026-04-21-agent-quality\",\"body\":\"A runtime prompt enhancer wraps each agent's base `system_prompt` with 6 mandatory sections: QUALITY FLOOR, BRAND VOICE, PLATFORM INTEGRITY, COMPLIANCE BASELINE, ESCALATE TO HUMAN, TOOL AWARENESS. Infrastructure provider names are stripped from every client-facing response (image, video, voice, leads, email). 29/29 quality tests passing; CI-ready.\",\"published\":true,\"published_at\":\"2026-04-21T16:00:00Z\",\"summary\":\"Every agent now carries MAARS operating standards, tool-usage hints, and a strict rule against naming backend providers.\",\"tag\":\"improvement\",\"title\":\"Agent quality upgrade + client-opacity rules\",\"updated_at\":\"2026-04-20T23:05:19.017652+00:00\"},{\"slug\":\"2026-04-21-campaigns\",\"body\":\"`POST /api/campaigns/run` takes a persona + subject/body template, pulls matching leads, personalizes via free-tier LLM, spreads sends across your `send_window_days` at your `daily_send_cap`, and the background scheduler fires them with compliance headers and suppression checks. Pause / resume any time. Customer-facing webhooks fire at `campaign.started`, `email.sent`, `email.bounced`, etc.\",\"published\":true,\"published_at\":\"2026-04-21T15:00:00Z\",\"summary\":\"Define a persona, MAARS finds prospects, drafts personalized emails, schedules across days, handles compliance.\",\"tag\":\"feature\",\"title\":\"Outbound campaigns — leads to inbox, fully automated\",\"updated_at\":\"2026-04-20T23:05:19.018652+00:00\"},{\"slug\":\"2026-04-21-referrals-webhooks\",\"body\":\"Public referral links at `/r/<code>` with 30-day attribution cookies. Referrer gets 20% of the referred user's first payment as credits (operator-configurable). Customer webhooks: subscribe to any of 10 event types (`campaign.started`, `email.opened`, `credit.topped_up`, etc.) with HMAC-SHA256 signatures and 3-retry delivery — the standard SaaS integration surface.\",\"published\":true,\"published_at\":\"2026-04-21T14:00:00Z\",\"summary\":\"20% lifetime credit rewards for referrers + HMAC-signed event webhooks customers can subscribe their own backends to.\",\"tag\":\"feature\",\"title\":\"Referral program + customer webhooks\",\"updated_at\":\"2026-04-20T23:05:19.018652+00:00\"}]}"