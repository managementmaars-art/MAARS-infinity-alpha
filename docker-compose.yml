version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:6.0
    container_name: maars-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - maars-network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maars-backend
    restart: always
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://admin:admin@mongo:27017}
      DB_NAME: ${DB_NAME:-maars_infinity}
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVER_PORT: 8000
      UPLOAD_DIR: /app/uploads
      # All other vars from .env can be passed through
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      DUCKDUCKGO_ENABLED: ${DUCKDUCKGO_ENABLED:-true}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    healthcheck:
      test: curl -f http://localhost:8000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - maars-network

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8000}
        REACT_APP_ENVIRONMENT: ${REACT_APP_ENVIRONMENT:-development}
    container_name: maars-frontend
    restart: always
    environment:
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8000}
      REACT_APP_ENVIRONMENT: ${REACT_APP_ENVIRONMENT:-development}
      REACT_APP_ENABLE_VOICE: ${REACT_APP_ENABLE_VOICE:-true}
      REACT_APP_ENABLE_VIDEO: ${REACT_APP_ENABLE_VIDEO:-true}
      REACT_APP_ENABLE_IMAGE_GENERATION: ${REACT_APP_ENABLE_IMAGE_GENERATION:-true}
      REACT_APP_ENABLE_WEB_SEARCH: ${REACT_APP_ENABLE_WEB_SEARCH:-true}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:3000 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - maars-network

  # Nginx Reverse Proxy (Optional - uncomment for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: maars-nginx
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - /etc/letsencrypt/:/etc/letsencrypt/:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - maars-network

volumes:
  mongo_data:
  mongo_config:

networks:
  maars-network:
    driver: bridge
