[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ley-ar"
version = "0.1.0"
description = "CLI para búsqueda en bases jurídicas argentinas (SAIJ, JUBA, CSJN, JUSCABA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.9.0", "httpx>=0.25.0", "rich>=13.0.0"]

[project.scripts]
ley = "ley.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ley"]
