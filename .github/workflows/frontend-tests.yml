name: Frontend Tests & Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend*.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: 'frontend/yarn.lock'
    
    - name: Install dependencies
      run: |
        cd frontend
        yarn install --frozen-lockfile
    
    - name: Run tests
      run: |
        cd frontend
        CI=true yarn test --watchAll=false --coverage
      continue-on-error: true
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./frontend/coverage/lcov.info
        flags: frontend
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: 'frontend/yarn.lock'
    
    - name: Install dependencies
      run: |
        cd frontend
        yarn install --frozen-lockfile
    
    - name: Run ESLint
      run: |
        cd frontend
        yarn lint
      continue-on-error: true

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: 'frontend/yarn.lock'
    
    - name: Install dependencies
      run: |
        cd frontend
        yarn install --frozen-lockfile
    
    - name: Build application
      run: |
        cd frontend
        REACT_APP_BACKEND_URL=http://localhost:8000 \
        REACT_APP_ENVIRONMENT=production \
        CI=false yarn build
    
    - name: Check build output
      run: |
        ls -lah frontend/build/
        du -sh frontend/build/
    
    - name: Build Docker image
      run: |
        docker build -f frontend/Dockerfile \
          --build-arg REACT_APP_BACKEND_URL=http://localhost:8000 \
          --build-arg REACT_APP_ENVIRONMENT=production \
          -t maars-frontend:latest ./frontend
    
    - name: Check image
      run: |
        docker images maars-frontend
