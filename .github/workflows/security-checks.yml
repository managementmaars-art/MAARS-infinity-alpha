name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check for hardcoded secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
      continue-on-error: true
    
    - name: Check .env files not committed
      run: |
        if git ls-files | grep -E '\.env$|\.env\.[a-z]+$' && [[ ! $(basename $(git ls-files | grep '\.env' | head -1)) == '.env.example' ]]; then
          echo "ERROR: .env files should not be committed!"
          echo "Offending files:"
          git ls-files | grep -E '\.env$|\.env\.[a-z]+$'
          exit 1
        fi
        echo "✓ No .env files found in git"

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Check Python dependencies
      run: |
        python -m pip install safety
        cd backend
        safety check --file requirements.txt
      continue-on-error: true
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: 'frontend/yarn.lock'
    
    - name: Check npm vulnerabilities
      run: |
        cd frontend
        yarn install --frozen-lockfile
        npm audit
      continue-on-error: true
