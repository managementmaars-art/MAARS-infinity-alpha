name: Backend Tests & Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend*.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      env:
        MONGO_URL: mongodb://admin:admin@localhost:27017
        DB_NAME: maars_infinity_test
        JWT_SECRET: test-secret-key-for-testing-only
        ENVIRONMENT: test
      run: |
        cd backend
        python -m pytest tests/ -v --tb=short --color=yes
    
    - name: Check code style (flake8)
      run: |
        cd backend
        flake8 . --max-line-length=120 --ignore=E501,W503 --count
      continue-on-error: true
    
    - name: Check code formatting (black)
      run: |
        cd backend
        black . --check --line-length=120
      continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -f backend/Dockerfile -t maars-backend:latest ./backend
    
    - name: Check image size
      run: |
        docker images maars-backend
    
    - name: Run container healthcheck
      run: |
        docker run --rm -d --name test-backend -p 8000:8000 \
          -e MONGO_URL=mongodb://localhost:27017 \
          -e DB_NAME=test \
          -e JWT_SECRET=test-secret \
          maars-backend:latest || true
        sleep 5
        docker rm -f test-backend || true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Run flake8
      run: |
        cd backend
        flake8 . --max-line-length=120 --ignore=E501,W503 --exclude=migrations,tests
      continue-on-error: true
    
    - name: Check import sorting (isort)
      run: |
        cd backend
        isort --check-only --diff .
      continue-on-error: true
